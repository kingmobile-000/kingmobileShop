<script>
/* KING LOGIN KEEPER: login ko browser ke localStorage ke alawa cookie + IndexedDB me bhi rakhta hai.
   Browser localStorage saaf kar de to login apne-aap wapas aa jata hai. Logout dabane par sab hat jata hai. */
(function(){
var K=["kms_user","kms_orders","kms_buyer","kms_boy_mobile","kms_boy_info","kms_boy_tok","kms_idov","kms_idov_all","kms_update_url"],CK=["kms_user","kms_boy_mobile","kms_boy_info","kms_boy_tok","kms_update_url"],LS=null;
try{LS=window.localStorage}catch(e){return}
var S=Storage.prototype,_s=S.setItem,_r=S.removeItem,db=null,pend=[],seen={};
function ckGet(n){try{var m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}catch(e){return null}}
function ckSet(n,v){try{document.cookie=n+"="+(v==null?"":encodeURIComponent(v))+"; max-age="+(v==null?0:63072000)+"; path=/; SameSite=Lax"}catch(e){}}
function idb(cb){if(db)return cb(db);try{var q=indexedDB.open("king_keep",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv")};q.onsuccess=function(){db=q.result;cb(db)};q.onerror=function(){cb(null)}}catch(e){cb(null)}}
function idbPut(k,v){idb(function(d){if(!d)return;try{var t=d.transaction("kv","readwrite").objectStore("kv");if(v==null)t["delete"](k);else t.put(v,k)}catch(e){}})}
function idbGet(k,cb){idb(function(d){if(!d)return cb(null);try{var r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=function(){cb(r.result==null?null:r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}})}
function mirror(k,v){if(K.indexOf(k)<0)return;idbPut(k,v);if(CK.indexOf(k)>-1)ckSet(k,v)}
S.setItem=function(k,v){_s.apply(this,arguments);if(this===LS)mirror(k,String(v))};
S.removeItem=function(k){_r.apply(this,arguments);if(this===LS)mirror(k,null)};
/* 1) shuru me: agar localStorage khali hai to cookie se turant wapas lao */
CK.forEach(function(k){try{if(LS.getItem(k)==null){var c=ckGet(k);if(c){_s.call(LS,k,c)}}}catch(e){}});
/* 2) IndexedDB se baaki (orders wagairah) wapas lao; kuch wapas aaya to page ek baar refresh */
var left=K.length,rest=0;
K.forEach(function(k){try{if(LS.getItem(k)!=null){left--;return}}catch(e){left--;return}
 idbGet(k,function(v){if(v!=null){try{_s.call(LS,k,v);rest++}catch(e){}}if(--left===0&&rest){try{if(!sessionStorage.getItem("kk_r")){sessionStorage.setItem("kk_r","1");location.reload()}}catch(e){}}})});
if(left===0&&false){}
/* 3) har 3 second me jaanch: kuch badla ho (iframe me bhi) to backup update, logout ho to backup hata do */
function tick(){K.forEach(function(k){var v=null;try{v=LS.getItem(k)}catch(e){}
 if(v!=null){if(seen[k]!==v){seen[k]=v;mirror(k,v)}}else if(seen[k]!=null){seen[k]=null;mirror(k,null)}})}
setInterval(tick,3000);setTimeout(tick,500);
document.addEventListener("visibilitychange",function(){if(document.hidden)tick()});
window.addEventListener("pagehide",tick);
/* 4) browser ko bolo ki is site ka data na hataye */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>

/* Flipkart design: grey photo tile, naam upar, Market Rs bada + Rs bold */

function variant(src,mode){

 for(i=0;i<256;i++){acc+=hist[i];if(acc>=n*0.02){lo=i;break}}acc=0;

 var T=(lo+hi)/2;
 if(mode==="b"){var tot=n,sB=0,wB=0,mx=-1;for(i=0;i<256;i++)sB+=i*hist[i];
  var sumB=0;for(i=0;i<256;i++){wB+=hist[i];if(!wB)continue;var wF=tot-wB;if(!wF)break;sumB+=i*hist[i];var mB=sumB/wB,mF=(sB-sumB)/wF,bt=wB*wF*(mB-mF)*(mB-mF);if(bt>mx){mx=bt;T=i}}}

/* ID ढूँढने का तरीका: पहले "Transaction ID / UTR / Ref No" के पास, फिर पूरे टेक्स्ट में */
function findUtr(txt){
 var lines=String(txt||"").replace(/[\u200b\u200e\u200f]/g,"").split(/\r?\n/),
  KEY=/(transaction\s*(id|no|number)|trans(action)?\s*id|txn\s*(id|no)|\butr\b|upi\s*(ref|transaction|txn)|ref(erence)?\s*(no|id|number)|reference)/i,
  SKIP=/(a\/c|account|acc\s*no|mobile|phone|\+91|order\s*id|google)/i;
 function fix(w){return w.replace(/[Oo]/g,"0").replace(/[Il|!]/g,"1").replace(/[Ss]/g,"5").replace(/B/g,"8").replace(/Z/g,"2")}
 function cands(line,kw){
  var out=[],t=line.replace(/\b(\d{4})[\s\-](\d{4})[\s\-](\d{4})\b/g,"$1$2$3"),tk=t.split(/[^A-Za-z0-9]+/),i,w,f,dg;
  for(i=0;i<tk.length;i++){w=tk[i];if(!w)continue;
   if(/^[Tt][0-9OoIl|!]{15,25}$/.test(w)&&(w.slice(1).match(/\d/g)||[]).length>=10){out.push("T"+fix(w.slice(1)));continue}
   if(w.length===12){f=fix(w);dg=(w.match(/\d/g)||[]).length;if(dg>=9&&/^\d{12}$/.test(f)&&!/^(\d)\1{11}$/.test(f)){out.push(f);continue}}
   if(kw&&w.length>=12&&w.length<=30&&(w.match(/\d/g)||[]).length>=8&&/^[A-Za-z0-9]+$/.test(w)&&!/^\d{13,}$/.test(w))out.push(w.toUpperCase())}
  return out}
 var i,j,c;
 for(i=0;i<lines.length;i++){if(!KEY.test(lines[i])||/google/i.test(lines[i]))continue;
  for(j=i;j<Math.min(lines.length,i+3);j++){if(j>i&&KEY.test(lines[j]))break;c=cands(lines[j],true);if(c.length)return c[0]}}
 for(i=0;i<lines.length;i++){if(SKIP.test(lines[i]))continue;c=cands(lines[i],false);if(c.length)return c[0]}

 function tess(){
  warmOcr();

   if(!w){fin("err");return}
   var k=0;(function next(){

    if(k>=PASSES.length||!s.big){fin("bad");return}
    var P=PASSES[k++],cv;try{cv=variant(s.big,P[0])}catch(e){next();return}

     .catch(function(){next()})})()}).catch(function(){fin("err")})}

     try{fetch(ORDER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body}).then(fin).catch(function(){bad()})}catch(e){bad()}})
  }catch(e){bad()}})}
/* 4) पूरा फोटो देखना */
function viewShot(o){
 var d=E("kmfv");if(d)d.remove();d=document.createElement("div");d.id="kmfv";
 d.innerHTML='<div class="kmfc"><div class="kmfh">📷 पेमेंट का फोटो · '+H(o.no||"")+'</div><img id="kmfi" class="kmfimg" alt="" src="'+(fullCache[o.id]||o.sthumb||"")+'"><div id="kmfm" class="kmfm">'+(fullCache[o.id]?"":"⏳ पूरा फोटो आ रहा है…")+'</div><button class="kmpb" id="kmfx" style="background:#6b7280">बंद करें</button></div>';
 document.body.appendChild(d);
 E("kmfx").onclick=function(){d.remove()};d.addEventListener("click",function(e){if(e.target===d)d.remove()});
 if(fullCache[o.id])return;
 try{fetch(ORDER_URL+(ORDER_URL.indexOf("?")<0?"?":"&")+"action=myshot&id="+encodeURIComponent(o.id)+"&mobile="+encodeURIComponent(t10(o.mobile))+"&t="+Date.now())
  .then(function(r){return r.json()}).then(function(j){var m=E("kmfm"),im=E("kmfi");if(!m)return;
   if(j&&j.ok&&j.data){fullCache[o.id]=j.data;im.src=j.data;m.textContent=""}else m.textContent="⚠ पूरा फोटो अभी नहीं आया, थोड़ी देर बाद दोबारा खोलिए"})
  .catch(function(){var m=E("kmfm");if(m)m.textContent="⚠ नेट की दिक्कत – दोबारा खोलिए"})}catch(e){}}
window.kmPshot=function(id){var o=findOrd(id);if(!o)return;if(o.shot)viewShot(o);else if(kmIsPend(o))attachPop(id)};
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("[data-pshot]");if(!t)return;e.preventDefault();e.stopPropagation();kmPshot(t.getAttribute("data-pshot"))},true);
/* ---------- validation + QR SCAN Now ---------- */
function valid(){
 var er=E("byerr"),n=E("byn").value.trim(),m=E("bym").value.replace(/\D/g,"");if(m.length>10)m=m.slice(-10);
 var a=E("bya").value.trim(),c=E("byc").value.trim(),pc=E("byp").value.replace(/\D/g,"");
 if(!n){er.textContent="⚠ कृपया अपना नाम लिखिए";E("byn").focus();return null}
 if(m.length!==10){er.textContent="⚠ मोबाइल नंबर 10 अंक का होना चाहिए";E("bym").focus();return null}
 if(byD==="home"&&!a){er.textContent="⚠ मकान नंबर / गली / मोहल्ला लिखिए";E("bya").focus();return null}
 if(byD==="home"&&!c){er.textContent="⚠ गाँव / शहर लिखिए";E("byc").focus();return null}
 if(byD==="home"&&pc.length!==6){er.textContent="⚠ पिनकोड 6 अंक का होना चाहिए";E("byp").focus();return null}
 er.textContent="";return{n:n,m:m}}
function dupPend(m,o){var a=readAll(),k=String(o.Item||""),sk=String(o.SKU==null?"":o.SKU);
 for(var i=0;i<a.length;i++){var x=a[i];if(t10(x.mobile)!==m||String(x.payment)!=="UPI")continue;
  if(String(x.item||"")!==k||String(x.sku==null?"":x.sku)!==sk)continue;
  if(["New","Confirmed","Shipped","OutForDelivery"].indexOf(normSt(x.status))>=0)return x}return null}
function scanNow(){
 var o=items[byI];if(!o)return;
 try{if(typeof kGoneBy==="function"&&kGoneBy())return}catch(e){}
 var v=valid();if(!v)return;
 var dup=dupPend(v.m,o);
 if(dup){popOpen('<div class="kmph">⚠ पहले से Pending है</div><div class="kmpt" style="font-size:16px">आपका यही आइटम पहले से Pending में पड़ा है'+(dup.no?' (ऑर्डर नंबर <b>'+H(dup.no)+'</b>)':'')+'।<br>कृपया पहले उस ऑर्डर को Done या Cancel कीजिए, धन्यवाद 🙏</div><button class="kmpb" id="kmdx" style="background:#6b7280">बंद करें</button>');E("kmdx").onclick=popClose;return}
 var reserve=function(){
  var key=itemKey(o);
  if(busy)return;busy=true;var b=E("bysend");if(b){b.disabled=true;b.textContent="⏳ ऑर्डर नंबर बन रहा है…"}
  reserveNo(v,o,function(no){busy=false;if(b){b.disabled=false}
   if(!no){drawBy();var er=E("byerr");if(er)er.textContent="⚠ नेट की दिक्कत से ऑर्डर नंबर नहीं बन सका, दोबारा दबाइए";return}
   pendNo=no;pendWrite(v.m,key,no);
   drawBy();pop1()})};
 var go=function(){popReady(reserve)};
 if(typeof kmGateAll==="function"&&typeof kmMobiles==="function")kmGateAll(kmMobiles(),go);else go()}
/* ---------- final order (sendBuy purane tareeke se, ab number = pendNo) ---------- */
var _ps=sendBuy;
function finalOrder(){window.__kmFinal=1;try{_ps()}finally{window.__kmFinal=0}}
var _cb=confirmBuy;
confirmBuy=function(){if(byP==="UPI"&&!window.KM_ONLINE_CLOSED){scanNow();return}return _cb.apply(this,arguments)};
sendBuy=function(){if(byP==="UPI"&&!window.KM_ONLINE_CLOSED&&!window.__kmFinal){scanNow();return}return _ps.apply(this,arguments)};
/* ---------- order jaate hi: UPI order "pending" (dukan ko tab dikhega jab payment photo lag jaye) ---------- */
var _po=pushOrder;
pushOrder=function(ord,photo){
 if(ord&&ord.payment==="UPI"&&!window.KM_ONLINE_CLOSED){ord.pendpay="1";var ua=kmUpiAmt(ord.total,ord.no);if(ua)ord.upiamt=ua}
 var r=_po.apply(this,arguments);
 if(ord&&ord.payment==="UPI"){shot=null;pendWrite(ord.mobile,String(ord.sku==null?"":ord.sku)+"|"+(ord.item||""),null)}
 return r};
var _ao=window.afterOrder;
window.afterOrder=function(o){var r=_ao?_ao.apply(this,arguments):undefined;
 try{if(o&&o.payment==="UPI"&&String(o.pendpay)==="1"&&!o.shot)setTimeout(function(){attachPop(o.id)},350)}catch(e){}return r};
window.kmPayState=function(){return{pendNo:pendNo,shot:!!shot}};
})();
